<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="DevBuild Studios page not found. Return to the official DevBuild community hub." />
    <link rel="icon" type="image/png" href="/devbuild-logo.png" />
    <title>Page Not Found | DevBuild Studios</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Arial, sans-serif;
        background: #f5f7fb;
        color: #101828;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(87, 112, 255, 0.14), transparent 34rem),
          linear-gradient(180deg, #ffffff, #eef2f7);
      }

      main {
        width: min(520px, 100%);
        padding: 34px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        border-radius: 18px;
        margin-bottom: 18px;
      }

      p:first-of-type {
        margin: 0 0 10px;
        color: #667085;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.1rem, 8vw, 4.4rem);
        letter-spacing: -0.06em;
      }

      p {
        margin: 14px auto 0;
        max-width: 34rem;
        color: #475467;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 24px;
        padding: 0 20px;
        border-radius: 999px;
        background: #111827;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/devbuild-logo.png" alt="DevBuild Studios logo" />
      <p>Error 404</p>
      <h1>Page not found</h1>
      <p>The page you opened does not exist or was moved. Return to the DevBuild Studios hub to continue.</p>
      <a href="/">Back to DevBuild Studios</a>
    </main>
  </body>
</html>
